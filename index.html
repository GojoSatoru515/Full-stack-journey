<!DOCTYPE html>
<html lang="en">   
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="styles.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>👨‍💻</text></svg>">
    <meta name="description" content="Portfolio of a web developer building clean, modern websites for small businesses.">
    <meta property="og:title" content="My Portfolio">
    <meta property="og:description" content="I build clean, modern websites for small businesses.">
    <meta property="og:type" content="website">
    <meta property="og:image" content="https://gojosatoru515.github.io/Full-stack-journey/me.jpg">
    <title>My Journey to Becoming a Web Developer</title>
</head>

<body>
    <header>
        <a href="#" class="logo">My Portfolio</a>
        <nav class="menu">
            <a href="#home" >Home</a>
            <a href="#projects" >Projects</a>
            <a href="#contact" >Contact</a>
        </nav>
    </header>

    <main>
        <h1>About me</h1>
        <p>I build websites for small businesses.</p>
        <img src="me.jpg" alt="Portrait of me" class="avatar">

        <section class="skills">
            <h2>What I do</h2>
            <div class="card"><h3>Web Design</h3><p>Clean, modern sites</p></div>
            <div class="card"><h3>Development</h3><p>Fast, Responsive builds</p></div>
            <div class="card"><h3>Maintenance</h3><p>Ongoing support</p>
            </div>
        </section>

        <section class="contact">
            <h2 class="sub-title">Get in touch</h2>
            <form>
                <label for="name">Your Full Name</label>
                <input id="name"
                name="name" type="text" placeholder="Your full name" required>

                <label for="email">Email</label>
                <input id="email" name="email" type="email" placeholder="Your email" required>

                <label for="message">Message</label>
                <textarea id="message" name="message" placeholder="Your message" required></textarea>
                <button type="submit">Send</button>
            </form>
        </section>
    </main>

    <footer>
        <p>&copy; 2026 My Portfolio</p>
    </footer>
</body>
</html>
