<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Day 13 — Order Summary</title>
</head>
<body>
  <h1>Order Summary</h1>

  <script>
    // --- The order, described with variables ---

    const storeName = "Chihuahua Tech Store";   // never changes → const, string
    const customerName = "Ana García";           // this order's buyer → const, string
    let orderStatus = "pending";                 // WILL change (shipped, paid...) → let, string

    const productName = "Mechanical Keyboard";   // const, string
    const productPrice = 89.99;                   // const, number
    let quantity = 2;                             // buyer could change it → let, number

    let discountCode = null;   // not entered YET → null (deliberately empty, not "forgotten")

    const freeShipping = true; // qualifies? yes/no → const, boolean

    // --- Prove the types are what we intended ---
    console.log("Price is a:", typeof productPrice);      // "number"
    console.log("Free shipping is a:", typeof freeShipping); // "boolean"

    // --- Readable dump of the whole order ---
    console.log("Store:", storeName);
    console.log("Customer:", customerName);
    console.log("Status:", orderStatus);
    console.log("Product:", productName);
    console.log("Price:", productPrice);
    console.log("Quantity:", quantity);
    console.log("Discount code:", discountCode);
    console.log("Free shipping:", freeShipping);
  </script>
</body>
</html>
