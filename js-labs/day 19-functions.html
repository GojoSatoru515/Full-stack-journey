<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Day 19 - functions</title>
</head>
<body>
    <h1>Day 19 - functions</h1>
    <script>
        
        
        function capitalize(word) { 
            if(!word){
                return "";
            }
            return word[0].toUpperCase() + word.slice(1).toLowerCase();
        }

        function clearName(rawName) {return rawName.trim().replace(/\s+/g, " ");}

       function formatName(rawName){
            const clean = clearName(rawName);
            const spaceIndex = clean.indexOf(" ");
        if(spaceIndex === -1){
            return capitalize(clean);
        }
        const first = clean.slice(0, spaceIndex);
        const last = clean.slice(spaceIndex + 1);
        return capitalize(first) + " " + capitalize(last);
        }
        
    
        function isValidEmail(email){
            const clean = email.trim().toLowerCase();
            return clean.includes("@") && clean.includes(".") && clean.indexOf("@")>0;
        }

        function maskPhone(rawPhone){
            const clean = rawPhone.replaceAll(" ", "");

            if(clean.length !== 10){
                return `Invalid Phone`;
                
            }
            return clean.slice(-4).padStart(clean.length,"*");
                  
        }

        function calculateNetPay(rate,hoursInput, discountRate, taxRate){
            const hours = Number(hoursInput);
            if(!hours||hours<=0){
                return 0;
            }
            const gross = rate * hours;
            const afterDiscount = gross - gross * discountRate;
            const net = afterDiscount - afterDiscount * taxRate;
            return net;
        }

        console.log(`Client: ${formatName("  northwind   CO ")} 
        Email: ${isValidEmail("hello@northwind.com") ? "valid" : "invalid"}
        Phone: ${maskPhone("1234567890")}
        Net pay: $${calculateNetPay(45, "42", 0.10, 0.16)}`);


    </script>


    </body>
</html>
