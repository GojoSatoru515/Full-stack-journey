<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Palindrome Checker</title>
</head>
<body>
  <main>
    <h1>Palindrome Checker</h1>
    <p>Open the browser console to see the palindrome check result.</p>
  </main>

  <script>
    const text = "";
    const normalized = text.toLowerCase().replace(/\s/g, "");

    if(normalized.length === 0){
        console.log("Nothing to check, please enter some text");
    } else{
      let reversed = "";
      
       for (let index = normalized.length - 1; index >= 0; index--) {
      reversed += normalized[index];
    }

    const isPalindrome = normalized === reversed;
    console.log(
      `${text} → ${isPalindrome ? "palindrome ✅" : "not a palindrome ❌"}`
    );
    }
  </script>
</body>
</html>
