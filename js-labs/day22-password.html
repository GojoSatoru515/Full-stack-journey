<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Day 22 - password generator</title>
</head>
<body>
    <h1>Day 22 - password generator</h1>
    <script>
        // Helper from before: random integer between min and max (both included)
        const randomInt = (min, max) => Math.floor(Math.random() * (max - min + 1)) + min;

        // Allowed characters. Look-alikes (I, l, O, 0) are left out on purpose.
        const CHARS = "ABCDEFGHJKLMNPQRSTUVWXYZabcdefghjkmnpqrstuvwxyz23456789";

        function generatePassword(length) {
            let password = "";                       // accumulator string
            for (let i = 0; i < length; i++) {
                const index = randomInt(0, CHARS.length - 1);  // valid index: 0 .. length-1
                password += CHARS.charAt(index);               // add one random character
            }
            return password;
        }

        // Quick test: two different 8-character passwords
        console.log(generatePassword(8));
        console.log(generatePassword(8));
     </script>


    </body>
</html>
